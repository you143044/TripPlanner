server {
    listen 80;
    server_name _;
    server_tokens off;  # 隐藏nginx版本号

    root /usr/share/nginx/html;
    index index.html;

    # ===== 压缩(窄带宽下显著加速,1Mbps带宽建议开启) =====
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ===== 静态资源长缓存(带内容哈希的文件可长缓存;index.html不缓存) =====
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 访问认证(防公网随意访问,朋友凭密码进入) =====
    # 密码文件: 服务器上 /opt/trip-planner/nginx_htpasswd
    auth_basic "HelloAgents 旅行助手 - 请输入访问密码";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ===== 安全响应头 =====
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # 禁止访问隐藏文件与备份
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(env|log|sqlite|db|pyc|bak)$ {
        deny all;
    }
}