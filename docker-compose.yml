version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trip-planner-postgres
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-trip}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-trip-secret-change-me}"
      POSTGRES_DB: trip_planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trip} -d trip_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: trip-planner-backend
    restart: always
    # 端口仅绑本机回环,不对外暴露(nginx经Docker内网代理backend:8000)
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-trip}:${POSTGRES_PASSWORD:-trip-secret-change-me}@postgres:5432/trip_planner"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      args:
        # 高德Web端(JS API)Key,构建时注入(由根目录.env或shell环境提供)
        VITE_AMAP_WEB_JS_KEY: "${VITE_AMAP_WEB_JS_KEY:-}"
    container_name: trip-planner-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - /etc/localtime:/etc/localtime:ro

volumes:
  postgres_data:
  backend_logs: